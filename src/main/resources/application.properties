# Configura GYMAPP_DB_URL, GYMAPP_DB_USER y GYMAPP_DB_PASSWORD en tu entorno.
spring.application.name=gymApp
server.port=8080

# ===== PostgreSQL Render =====
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== RENIEC API (Decolecta) =====
reniec.api.url=https://api.decolecta.com/v1/reniec/dni
reniec.api.token=${RENIEC_API_TOKEN:}

spring.main.headless=false
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.statement-timeout=15000
